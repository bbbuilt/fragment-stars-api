[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fragment-stars-api"
version = "2.1.5"
description = "Lowest-cost Telegram Stars and Premium API for Fragment.com - KYC 0%, no-KYC 0.25%, TON/USDT"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Basebay", email = "basebay@proton.me"}
]
keywords = ["telegram", "telegram-stars", "telegram-premium", "stars-api", "fragment", "fragment-api", "fragment-stars", "ton", "ton-blockchain", "usdt", "usdt-ton", "api", "api-client", "python-sdk", "telegram-bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://fragment-api.space"
Documentation = "https://fragment-api.space"
Repository = "https://github.com/bbbuilt/fragment-stars-api"
Issues = "https://github.com/bbbuilt/fragment-stars-api/issues"
"Example Shop" = "https://github.com/bbbuilt/tg_stars_premium_shop"

[tool.setuptools.packages.find]
include = ["fragment_api*"]

[tool.setuptools.package-data]
fragment_api = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
