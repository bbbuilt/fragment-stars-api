      <text x="109" y="222" fill="#5EEAD4" font-size="12" font-weight="700">WE HANDLE THE COMPLEXITY</text>
    </g>

    <path d="M906 412H962M944 394L964 412L944 430" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <g transform="translate(988 316)">
      <rect width="250" height="198" rx="24" fill="#081A31" stroke="#253C67" stroke-width="2"/>
      <circle cx="48" cy="46" r="22" fill="#402397"/>
      <path d="M36 38H60L48 60L36 38ZM40 42L48 56L56 42H40Z" fill="#C4B5FD"/>
      <text x="32" y="98" fill="#FFFFFF" font-size="28" font-weight="700">TON</text>
      <text x="32" y="130" fill="#8FA8C2" font-size="17">or USDT on TON</text>
