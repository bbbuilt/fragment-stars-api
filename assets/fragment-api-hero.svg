      <rect width="408" height="238" rx="28" fill="#082438" stroke="url(#cyan)" stroke-width="3"/>
      <circle cx="58" cy="56" r="28" fill="url(#cyan)"/>
      <path d="M58 38L63.5 49.2L76 51L67 59.8L69.1 72.2L58 66.3L46.9 72.2L49 59.8L40 51L52.5 49.2L58 38Z" fill="white"/>
