      </g>
      <g stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M42 120L48 126L58 114"/><path d="M42 153L48 159L58 147"/><path d="M42 186L48 192L58 180"/>
