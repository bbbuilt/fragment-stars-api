    <text x="68" y="148" fill="#B9D9EA" font-size="31">for <tspan fill="#38BDF8" font-weight="700">Fragment.com</tspan></text>

    <rect x="68" y="181" width="228" height="48" rx="24" fill="#09283D" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="92" y="213" fill="#E9FAFF" font-size="19" font-weight="700">KYC 0% FOREVER</text>
    <rect x="312" y="181" width="260" height="48" rx="24" fill="#0A2D2A" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="336" y="213" fill="#E9FFF8" font-size="19" font-weight="700">NO-KYC ONLY 0.25%</text>
    <rect x="588" y="181" width="186" height="48" rx="24" fill="#121F39" stroke="#60A5FA" stroke-opacity="0.55"/>
    <text x="612" y="213" fill="#EFF6FF" font-size="19" font-weight="700">NO API KEY</text>
    <text x="68" y="267" fill="#65E6D1" font-size="22" font-weight="700" letter-spacing="1">THE CHEAPEST FRAGMENT API</text>

    <g transform="translate(68 316)">
      <rect width="300" height="198" rx="24" fill="#071B2D" stroke="#1E4662" stroke-width="2"/>
      <circle cx="48" cy="46" r="22" fill="#0C3757"/>
      <path d="M36 41H60V51H36V41ZM39 44V48H57V44H39Z" fill="#38BDF8"/>
      <text x="32" y="96" fill="#FFFFFF" font-size="26" font-weight="700">Your backend</text>
      <text x="32" y="132" fill="#90AEC3" font-size="18">bot · shop · API server</text>
      <rect x="32" y="154" width="176" height="30" rx="15" fill="#0B3150"/>
