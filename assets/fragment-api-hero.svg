<svg width="1536" height="590" viewBox="0 0 1536 590" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lowest-cost Telegram Stars API for Fragment.com</title>
  <desc id="desc">KYC purchases have zero percent API commission and no-KYC purchases have a 0.25 percent API commission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1536" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03101C"/>
      <stop offset="0.55" stop-color="#061A2C"/>
      <stop offset="1" stop-color="#020A13"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#48D7E8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1536" height="590" rx="24" fill="url(#bg)"/>
  <rect width="1536" height="590" rx="24" fill="url(#grid)"/>
  <circle cx="1340" cy="36" r="300" fill="#0EA5E9" opacity="0.08"/>
  <circle cx="235" cy="640" r="340" fill="#14B8A6" opacity="0.08"/>

  <g font-family="Verdana, Geneva, sans-serif">
