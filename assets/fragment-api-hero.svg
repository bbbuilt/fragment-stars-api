    <path d="M1262 412H1310M1294 394L1314 412L1294 430" stroke="#FACC15" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g transform="translate(1326 329)">
      <circle cx="68" cy="67" r="52" stroke="#FDE68A" stroke-width="5"/>
      <path d="M68 32L77 54L101 56L82 72L88 96L68 83L48 96L54 72L35 56L59 54L68 32Z" fill="#F59E0B"/>
